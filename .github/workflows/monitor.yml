name: ENPI LPL 24/7 Monitor

on:
  schedule:
    # Every 5 minutes, offset by 3 to avoid congested top-of-hour.
    # GitHub may delay by up to ~10 min under load — treat as "approximately every 5 min".
    - cron: "3-58/5 * * * *"
  workflow_dispatch:  # Manual run from GitHub UI or external scheduler

# Prevents two concurrent scans from racing on state.json
concurrency:
  group: enpi-monitor
  cancel-in-progress: false

# Needed to commit state.json updates back to the repo
permissions:
  contents: write

jobs:
  scan:
    name: Scan ENPI LPL
    runs-on: ubuntu-latest
    timeout-minutes: 8   # Kill run if it hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ENPI monitor
        env:
          # Targets (comma-separated, overrides DEFAULT_TARGETS in code)
          TARGET_WILAYAS: "Alger,Tipaza,Blida,Boumerdes"
          MONITOR_ALL_WILAYAS: "false"

          # ── ntfy push (store in GitHub Secrets) ──
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # NTFY_SERVER: https://ntfy.sh  # leave blank to use default

          # ── WhatsApp CallMeBot (multi-recipient phone:apikey, store in GitHub Secrets) ──
          WHATSAPP_TARGETS: ${{ secrets.WHATSAPP_TARGETS }}

          # ── Email backup (optional) ──
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}

          # ── Dead-man's switch (optional, free at healthchecks.io) ──
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

        run: python monitor.py

      # Commit state.json ONLY when it actually changed.
      # Commits made with GITHUB_TOKEN do NOT trigger new workflow runs,
      # and this workflow has no `push` trigger → zero infinite loop risk.
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            echo "state.json changed — committing"
            git config user.name  "enpi-monitor[bot]"
            git config user.email "enpi-monitor[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: update snapshot [skip ci]"
            git pull --rebase --autostash -q || true
            git push || (sleep 5 && git pull --rebase -q && git push)
          else
            echo "No state change — nothing to commit"
          fi
